name: Genshin Web CI

on:
  push:
    paths:
      - "genshin-builder-app/**"
      - "shared/domain-golden/**"
      - ".github/workflows/genshin-web-ci.yml"
      - ".nvmrc"
      - ".node-version"
  pull_request:
    paths:
      - "genshin-builder-app/**"
      - "shared/domain-golden/**"
      - ".github/workflows/genshin-web-ci.yml"
      - ".nvmrc"
      - ".node-version"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genshin-builder-app
    env:
      # CI-only disposable Postgres (service container below). Not production.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/genshin_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/genshin_test?schema=public"
      RUN_REPLACEMENT_DB_TEST: "true"
      RUN_BUILD_GUIDE_DB_TEST: "true"
      # External guide providers stay OFF in CI (no network keys).
      YOUTUBE_GUIDE_ENABLED: "false"
      YOUTUBE_DISCOVERY_ENABLED: "false"
      YOUTUBE_AUTOMATION_ENABLED: "false"
      YOUTUBE_AUTO_PUBLISH_ENABLED: "false"
      GEMINI_VIDEO_ANALYSIS_ENABLED: "false"
      DEEPSEEK_GUIDE_ANALYSIS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genshin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: genshin-builder-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply PostgreSQL migrations
        run: npx prisma migrate deploy

      - name: Migration status
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev
