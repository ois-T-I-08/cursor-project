# AZA.GG abyss statistics -> staging ingest (outside Vercel)
#
# Vercel staging cannot reach AZA (HTTP 403). This job fetches AZA and POSTs
# raw JSON to the staging ingest API, which normalizes into ExternalApiCache.
#
# Note: AZA may also return 403 to GitHub-hosted runners (datacenter IP).
# If fetch fails with 403, use scripts/abyss-aza-ingest-staging.ps1 locally
# (residential/local network) with STAGING_ABYSS_INGEST_SECRET set in the shell.
#
# Required repository secrets (staging only — do not reuse production values):
#   STAGING_ABYSS_INGEST_URL    e.g. https://staging-sable.vercel.app/api/abyss/statistics/ingest
#   STAGING_ABYSS_INGEST_SECRET same value as Vercel staging ABYSS_INGEST_SECRET

name: Abyss AZA ingest (staging)

on:
  schedule:
    # Every 4 hours (UTC)
    - cron: "17 */4 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch AZA abyss statistics
        id: fetch
        run: |
          set -euo pipefail
          UA_LIST=(
            "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "Mozilla/5.0 (compatible; GenshinBuilder-GHA/0.1; +https://github.com/ois-T-I-08/cursor-project)"
          )
          ok=0
          for ua in "${UA_LIST[@]}"; do
            code=$(curl -sS -o aza-abyss.json -w "%{http_code}" \
              --retry 2 \
              --retry-delay 5 \
              --max-time 30 \
              -H "Accept: application/json" \
              -H "User-Agent: ${ua}" \
              "https://c1-api.aza.gg/kv/read?key_id=genshin_abyss_statistics" || true)
            echo "aza_http_status=${code}"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "AZA fetch failed from GitHub-hosted runner (often HTTP 403)." >&2
            echo "Use local script scripts/abyss-aza-ingest-staging.ps1 instead." >&2
            exit 1
          fi
          bytes=$(wc -c < aza-abyss.json)
          echo "aza_bytes=${bytes}"
          if [ "$bytes" -lt 100 ] || [ "$bytes" -gt 2097152 ]; then
            echo "unexpected AZA payload size" >&2
            exit 1
          fi
          python3 -c 'import json,sys; json.load(open("aza-abyss.json",encoding="utf-8"))'

      - name: POST ingest to staging
        env:
          STAGING_ABYSS_INGEST_URL: ${{ secrets.STAGING_ABYSS_INGEST_URL }}
          STAGING_ABYSS_INGEST_SECRET: ${{ secrets.STAGING_ABYSS_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_ABYSS_INGEST_URL:-}" ] || [ -z "${STAGING_ABYSS_INGEST_SECRET:-}" ]; then
            echo "missing staging ingest secrets" >&2
            exit 1
          fi
          # Do not echo URL, secret, or response body.
          code=$(curl -sS -o ingest-response.json -w "%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${STAGING_ABYSS_INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @aza-abyss.json \
            "${STAGING_ABYSS_INGEST_URL}")
          echo "ingest_http_status=${code}"
          if [ "$code" != "200" ]; then
            echo "ingest failed" >&2
            exit 1
          fi
          python3 -c 'import json; d=json.load(open("ingest-response.json",encoding="utf-8")); assert d.get("ok") is True; print("sampleSize=", d.get("sampleSize")); print("expiresAt=", d.get("expiresAt"))'
